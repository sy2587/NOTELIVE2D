<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Kumi Study MVP Database ERD</title>
  <desc>Entity relationship diagram for users, roles, semesters, subjects, folders, notes, tags, note tags, and tasks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .background { fill: #f8fafc; }
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #475569; }
      .table { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .head-user { fill: #2563eb; }
      .head-content { fill: #0f766e; }
      .head-system { fill: #7c3aed; }
      .head-task { fill: #c2410c; }
      .table-head { font: 700 18px 'Segoe UI', sans-serif; fill: #ffffff; }
      .field { font: 400 14px 'Consolas', monospace; fill: #334155; }
      .key { font-weight: 700; fill: #0f172a; }
      .relation { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .relation-label { font: 600 12px 'Segoe UI', sans-serif; fill: #475569; }
      .legend { font: 400 14px 'Segoe UI', sans-serif; fill: #475569; }
      .legend-title { font: 700 15px 'Segoe UI', sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="background" width="1600" height="1200"/>
  <text class="title" x="60" y="58">Kumi Study MVP Database ERD</text>
  <text class="subtitle" x="60" y="88">第一階段：帳號、學期、科目、筆記、標籤與待辦事項</text>

  <!-- Relationships behind tables -->
  <path class="relation" d="M250 165 C345 130, 385 130, 450 165"/>
  <text class="relation-label" x="330" y="125">owner_id</text>
  <path class="relation" d="M250 210 C270 240, 285 275, 300 305"/>
  <text class="relation-label" x="255" y="270">user_id</text>
  <path class="relation" d="M450 360 C440 390, 420 420, 420 450"/>
  <text class="relation-label" x="350" y="410">owner_id</text>
  <path class="relation" d="M650 205 C720 205, 750 205, 800 205"/>
  <text class="relation-label" x="700" y="190">semester_id</text>
  <path class="relation" d="M650 515 C705 515, 750 515, 800 515"/>
  <text class="relation-label" x="695" y="500">subject_id</text>
  <path class="relation" d="M650 555 C710 600, 750 620, 800 620"/>
  <text class="relation-label" x="690" y="610">folder_id</text>
  <path class="relation" d="M250 170 C500 300, 600 395, 800 465"/>
  <text class="relation-label" x="510" y="330">owner_id</text>
  <path class="relation" d="M1000 360 C1080 400, 1130 435, 1200 465"/>
  <text class="relation-label" x="1080" y="405">owner_id</text>
  <path class="relation" d="M1000 590 C1090 665, 1145 720, 1200 780"/>
  <text class="relation-label" x="1090" y="700">note_id</text>
  <path class="relation" d="M1350 590 C1335 665, 1315 720, 1300 780"/>
  <text class="relation-label" x="1330" y="690">tag_id</text>
  <path class="relation" d="M250 215 C450 650, 560 900, 800 950"/>
  <text class="relation-label" x="430" y="790">owner_id</text>
  <path class="relation" d="M1000 930 C1060 900, 1080 875, 1120 850"/>
  <text class="relation-label" x="1030" y="890">subject_id</text>

  <!-- Users -->
  <g>
    <rect class="table" x="60" y="110" width="300" height="245"/>
    <rect class="head-user" x="60" y="110" width="300" height="42" rx="10"/>
    <rect class="head-user" x="60" y="132" width="300" height="20"/>
    <text class="table-head" x="80" y="138">users</text>
    <text class="field key" x="80" y="180">PK  id BIGINT</text>
    <text class="field" x="80" y="204">username VARCHAR(50) UNIQUE</text>
    <text class="field" x="80" y="228">email VARCHAR(255) UNIQUE</text>
    <text class="field" x="80" y="252">password_hash VARCHAR(255)</text>
    <text class="field" x="80" y="276">display_name VARCHAR(100)</text>
    <text class="field" x="80" y="300">status VARCHAR(20)</text>
    <text class="field" x="80" y="324">created_at / updated_at</text>
    <text class="field" x="80" y="348">deleted_at</text>
  </g>

  <!-- Roles -->
  <g>
    <rect class="table" x="60" y="430" width="300" height="125"/>
    <rect class="head-system" x="60" y="430" width="300" height="42" rx="10"/>
    <rect class="head-system" x="60" y="452" width="300" height="20"/>
    <text class="table-head" x="80" y="458">roles</text>
    <text class="field key" x="80" y="500">PK  id BIGINT</text>
    <text class="field" x="80" y="524">name VARCHAR(50) UNIQUE</text>
    <text class="field" x="80" y="548">USER / ADMIN</text>
  </g>

  <!-- User roles -->
  <g>
    <rect class="table" x="400" y="250" width="250" height="125"/>
    <rect class="head-system" x="400" y="250" width="250" height="42" rx="10"/>
    <rect class="head-system" x="400" y="272" width="250" height="20"/>
    <text class="table-head" x="420" y="278">user_roles</text>
    <text class="field key" x="420" y="320">PK/FK user_id</text>
    <text class="field key" x="420" y="344">PK/FK role_id</text>
    <text class="field" x="420" y="368">many-to-many</text>
  </g>

  <!-- Semesters -->
  <g>
    <rect class="table" x="450" y="110" width="300" height="245"/>
    <rect class="head-content" x="450" y="110" width="300" height="42" rx="10"/>
    <rect class="head-content" x="450" y="132" width="300" height="20"/>
    <text class="table-head" x="470" y="138">semesters</text>
    <text class="field key" x="470" y="180">PK  id BIGINT</text>
    <text class="field key" x="470" y="204">FK  owner_id</text>
    <text class="field" x="470" y="228">name VARCHAR(100)</text>
    <text class="field" x="470" y="252">start_date DATE</text>
    <text class="field" x="470" y="276">end_date DATE</text>
    <text class="field" x="470" y="300">status VARCHAR(20)</text>
    <text class="field" x="470" y="324">created_at / updated_at</text>
    <text class="field" x="470" y="348">owner = users.id</text>
  </g>

  <!-- Subjects -->
  <g>
    <rect class="table" x="800" y="110" width="340" height="270"/>
    <rect class="head-content" x="800" y="110" width="340" height="42" rx="10"/>
    <rect class="head-content" x="800" y="132" width="340" height="20"/>
    <text class="table-head" x="820" y="138">subjects</text>
    <text class="field key" x="820" y="180">PK  id BIGINT</text>
    <text class="field key" x="820" y="204">FK  owner_id</text>
    <text class="field" x="820" y="228">FK  semester_id NULL</text>
    <text class="field" x="820" y="252">name VARCHAR(150)</text>
    <text class="field" x="820" y="276">color / icon</text>
    <text class="field" x="820" y="300">teacher / classroom</text>
    <text class="field" x="820" y="324">class_schedule</text>
    <text class="field" x="820" y="348">status / deleted_at</text>
    <text class="field" x="820" y="372">created_at / updated_at</text>
  </g>

  <!-- Folders -->
  <g>
    <rect class="table" x="450" y="450" width="300" height="170"/>
    <rect class="head-content" x="450" y="450" width="300" height="42" rx="10"/>
    <rect class="head-content" x="450" y="472" width="300" height="20"/>
    <text class="table-head" x="470" y="478">folders</text>
    <text class="field key" x="470" y="520">PK  id BIGINT</text>
    <text class="field key" x="470" y="544">FK  owner_id</text>
    <text class="field" x="470" y="568">name VARCHAR(100)</text>
    <text class="field" x="470" y="592">created_at / updated_at</text>
    <text class="field" x="470" y="616">UNIQUE(owner_id, name)</text>
  </g>

  <!-- Notes -->
  <g>
    <rect class="table" x="800" y="450" width="340" height="275"/>
    <rect class="head-content" x="800" y="450" width="340" height="42" rx="10"/>
    <rect class="head-content" x="800" y="472" width="340" height="20"/>
    <text class="table-head" x="820" y="478">notes</text>
    <text class="field key" x="820" y="520">PK  id BIGINT</text>
    <text class="field key" x="820" y="544">FK  owner_id</text>
    <text class="field" x="820" y="568">FK  subject_id NULL</text>
    <text class="field" x="820" y="592">FK  folder_id NULL</text>
    <text class="field" x="820" y="616">title VARCHAR(255)</text>
    <text class="field" x="820" y="640">content LONGTEXT</text>
    <text class="field" x="820" y="664">content_format</text>
    <text class="field" x="820" y="688">favorite / pinned / status</text>
    <text class="field" x="820" y="712">created / updated / deleted</text>
  </g>

  <!-- Tags -->
  <g>
    <rect class="table" x="1200" y="450" width="300" height="170"/>
    <rect class="head-content" x="1200" y="450" width="300" height="42" rx="10"/>
    <rect class="head-content" x="1200" y="472" width="300" height="20"/>
    <text class="table-head" x="1220" y="478">tags</text>
    <text class="field key" x="1220" y="520">PK  id BIGINT</text>
    <text class="field key" x="1220" y="544">FK  owner_id</text>
    <text class="field" x="1220" y="568">name VARCHAR(50)</text>
    <text class="field" x="1220" y="592">UNIQUE(owner_id, name)</text>
    <text class="field" x="1220" y="616">created_at / updated_at</text>
  </g>

  <!-- Note tags -->
  <g>
    <rect class="table" x="1200" y="760" width="300" height="125"/>
    <rect class="head-system" x="1200" y="760" width="300" height="42" rx="10"/>
    <rect class="head-system" x="1200" y="782" width="300" height="20"/>
    <text class="table-head" x="1220" y="788">note_tags</text>
    <text class="field key" x="1220" y="830">PK/FK note_id</text>
    <text class="field key" x="1220" y="854">PK/FK tag_id</text>
    <text class="field" x="1220" y="878">many-to-many</text>
  </g>

  <!-- Tasks -->
  <g>
    <rect class="table" x="800" y="850" width="340" height="245"/>
    <rect class="head-task" x="800" y="850" width="340" height="42" rx="10"/>
    <rect class="head-task" x="800" y="872" width="340" height="20"/>
    <text class="table-head" x="820" y="878">tasks</text>
    <text class="field key" x="820" y="920">PK  id BIGINT</text>
    <text class="field key" x="820" y="944">FK  owner_id</text>
    <text class="field" x="820" y="968">FK  subject_id NULL</text>
    <text class="field" x="820" y="992">title / description</text>
    <text class="field" x="820" y="1016">priority / status</text>
    <text class="field" x="820" y="1040">due_date / completed_at</text>
    <text class="field" x="820" y="1064">created / updated / deleted</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60,1130)">
    <text class="legend-title" x="0" y="0">圖例</text>
    <text class="legend" x="60" y="0">PK = Primary Key</text>
    <text class="legend" x="220" y="0">FK = Foreign Key</text>
    <text class="legend" x="370" y="0">owner_id = 資料擁有者</text>
    <text class="legend" x="650" y="0">藍色：帳號</text>
    <text class="legend" x="760" y="0">綠色：學習內容</text>
    <text class="legend" x="930" y="0">紫色：關聯或系統</text>
    <text class="legend" x="1100" y="0">橘色：待辦</text>
  </g>
</svg>
